# =============================================================================
# Reusable Workflow: Coverage Gate & PR Comment
# =============================================================================
# Enforces code coverage thresholds and posts a summary comment on pull
# requests. Designed to run AFTER build-and-test.yml has uploaded the
# 'coverage-reports' artifact containing Cobertura XML files.
#
# This workflow is a thin PRESET over the `actions/coverage-gate` composite
# action (single source of truth — the gate logic lives in the action and the
# shared scripts/ci/coverage-gate.sh). Its inputs/outputs/defaults are
# UNCHANGED from the pre-refactor workflow, so the existing consumers
# (strategos/basileus/DataFerry) need no change and keep identical
# aggregate/line behavior at default inputs.
#
# Usage:
#   jobs:
#     coverage:
#       uses: lvlup-sw/.github/.github/workflows/coverage-gate.yml@main
#       with:
#         coverage-threshold: 90
#
# Behavior:
#   - Downloads coverage artifacts from the calling workflow
#   - Merges reports using ReportGenerator
#   - Invokes the coverage-gate composite action to enforce the threshold
#   - Posts or updates a PR comment with the coverage summary
# =============================================================================

name: Coverage Gate

on:
  workflow_call:
    inputs:
      coverage-threshold:
        description: 'Minimum line coverage percent'
        required: false
        type: number
        default: 90
      dotnet-version:
        description: '.NET SDK version for ReportGenerator (e.g., 9.0.x, 10.0.x)'
        required: false
        type: string
        default: '9.0.x'
      runner:
        description: 'GitHub Actions runner label'
        required: false
        type: string
        default: 'self-hosted'
      gate-mode:
        description: 'Gate mode: aggregate (default), per-project, or per-assembly. Pass-through to the coverage-gate action.'
        required: false
        type: string
        default: 'aggregate'
      metrics:
        description: 'Aggregate-mode metric: line (default) or line+branch. Pass-through to the coverage-gate action.'
        required: false
        type: string
        default: 'line'

jobs:
  coverage-gate:
    name: Enforce Coverage Threshold
    runs-on: ${{ inputs.runner }}
    permissions:
      pull-requests: write
    steps:
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: ./coverage-reports

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Install ReportGenerator
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Merge coverage reports
        run: |
          reportgenerator \
            -reports:"./coverage-reports/**/coverage.cobertura.xml" \
            -targetdir:"./coverage-merged" \
            -reporttypes:"Cobertura;TextSummary"

      - name: Coverage gate
        uses: lvlup-sw/.github/actions/coverage-gate@main
        with:
          threshold: ${{ inputs.coverage-threshold }}
          gate-mode: ${{ inputs.gate-mode }}
          metrics: ${{ inputs.metrics }}
          coverage-file: ./coverage-merged/Cobertura.xml
          report-dir: ./coverage-reports
          output-dir: ./coverage-merged
          github-token: ${{ github.token }}
