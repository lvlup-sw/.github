name: Shared CI qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: Shared CI lane canary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash scripts/ci/run-shared-qualification.sh
